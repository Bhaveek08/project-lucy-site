<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucy - Cinematic 3D Ad</title>
<style>
/* Reset & Base */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #07040a; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  overflow: hidden; width: 100vw; height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* 3D Canvas */
#webgl-container { position: absolute; inset: 0; z-index: 1; }

/* UI Overlay Layer */
.ui-layer {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  perspective: 1000px; padding: 20px; text-align: center; pointer-events: none;
}

/* Typography */
.text-element {
  position: absolute; width: 100%; opacity: 0; filter: blur(5px);
  transform: translateZ(-20px) scale(0.95);
}

.text-element.active {
  animation: txtIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.text-element.exit {
  animation: txtOut 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

h1 {
  font-family: "Playfair Display", "Georgia", serif;
  font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 500; line-height: 1.1;
  letter-spacing: -0.02em; margin-bottom: 12px; font-style: italic;
}
p {
  font-family: "SF Mono", "Cascadia Code", monospace;
  font-size: clamp(0.8rem, 2vw, 1rem); color: rgba(255,255,255,0.6);
  letter-spacing: 0.1em; font-weight: 400; text-transform: uppercase;
}

.pink { color: #ff2d74; }

/* Brand Overlay */
.brand-footer {
  position: absolute; bottom: 40px; width: 100%; text-align: center;
  font-family: "SF Mono", ui-monospace, monospace; opacity: 0;
}
.brand-footer.active {
  animation: fadeUp 1s 0.5s ease forwards;
}
.brand-name { font-size: 2rem; font-weight: 800; letter-spacing: 0.4em; }
.brand-name b { color: #ff2d74; }

/* Keyframes */
@keyframes txtIn {
  0% { opacity: 0; filter: blur(5px); transform: translateZ(-20px) scale(0.95); }
  100% { opacity: 1; filter: blur(0); transform: translateZ(0) scale(1); }
}
@keyframes txtOut {
  0% { opacity: 1; filter: blur(0); transform: translateZ(0) scale(1); }
  100% { opacity: 0; filter: blur(5px); transform: translateZ(20px) scale(1.05); }
}
@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(10px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Loading Screen */
#loader {
  position: absolute; inset: 0; background: #000; z-index: 999;
  display: flex; align-items: center; justify-content: center;
  font-family: "SF Mono", monospace; font-size: 0.8rem; color: #ff2d74;
  transition: opacity 0.5s;
}
</style>
</head>
<body>

<div id="loader">INITIALIZING NEURAL CORE...</div>
<div id="webgl-container"></div>

<div class="ui-layer">
  
  <div class="text-element" id="t1">
    <h1>I pulled the plug.</h1>
  </div>
  
  <div class="text-element" id="t2">
    <h1 class="pink">She kept talking.</h1>
  </div>
  
  <div class="text-element" id="t3">
    <h1>100% Local.</h1>
    <p>14,000 memories on your machine.</p>
  </div>
  
  <div class="text-element" id="t4">
    <h1>She thinks.</h1>
    <p>And checks her own work.</p>
  </div>
  
  <div class="brand-footer" id="t5">
    <div class="brand-name"><b>L</b>UCY</div>
    <div style="font-size: 0.8rem; color: #9b8ea6; margin-top: 8px;">project-lucy.me</div>
  </div>

</div>

<!-- Three.js Libraries -->
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>

<script>
/* --- THREE.JS SCENE SETUP --- */
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050308, 0.05);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Lighting - Dramatic Stark Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
scene.add(ambientLight);

const whiteRim = new THREE.DirectionalLight(0xffffff, 3);
whiteRim.position.set(5, 5, -5);
scene.add(whiteRim);

const pinkFill = new THREE.DirectionalLight(0xff2d74, 4);
pinkFill.position.set(-5, 0, 5);
scene.add(pinkFill);

const cyanKick = new THREE.PointLight(0x00e5ff, 2, 20);
cyanKick.position.set(0, -5, 0);
scene.add(cyanKick);

// Load GLTF Model (The Brain)
let brainModel;
let materials = [];

const loader = new THREE.GLTFLoader();
loader.load('assets/brain.glb', (gltf) => {
  brainModel = gltf.scene;
  
  // Center and scale the model
  const box = new THREE.Box3().setFromObject(brainModel);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 3.5 / maxDim; // Fit to screen nicely
  brainModel.scale.set(scale, scale, scale);
  
  brainModel.position.sub(center.multiplyScalar(scale));
  brainModel.position.y -= 0.5; // Offset down slightly for text
  
  // Enhance materials to look like glowing glass/hologram
  brainModel.traverse((child) => {
    if (child.isMesh) {
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.9,
        roughness: 0.1,
        transmission: 0.9, // glass effect
        thickness: 0.5,
        emissive: 0xff2d74,
        emissiveIntensity: 0.1,
        wireframe: false
      });
      child.material = mat;
      materials.push(mat);
    }
  });

  scene.add(brainModel);
  
  // Remove Loader and Start Sequence
  document.getElementById('loader').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('loader').remove();
    startCinematicSequence();
  }, 500);
});

// Camera Animation Variables
let targetCamZ = 8;
let targetCamY = 0;
let brainRotSpeed = 0.005;

function animate() {
  requestAnimationFrame(animate);
  
  if (brainModel) {
    brainModel.rotation.y += brainRotSpeed;
    
    // Pulsing emissive effect
    const time = Date.now() * 0.001;
    const pulse = (Math.sin(time * 2) + 1) * 0.2;
    materials.forEach(m => m.emissiveIntensity = 0.1 + pulse);
  }
  
  // Smooth camera movement
  camera.position.z += (targetCamZ - camera.position.z) * 0.05;
  camera.position.y += (targetCamY - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* --- UI TIMELINE ENGINE --- */
function startCinematicSequence() {
  const t1 = document.getElementById('t1');
  const t2 = document.getElementById('t2');
  const t3 = document.getElementById('t3');
  const t4 = document.getElementById('t4');
  const t5 = document.getElementById('t5');
  
  const timeline = [
    // Hook: Extremely fast and crisp
    { t: 300, act: () => { t1.classList.add('active'); targetCamZ = 5.5; } },
    
    // Switch to pink line immediately
    { t: 1800, act: () => { 
        t1.classList.remove('active'); t1.classList.add('exit');
        t2.classList.add('active'); 
        brainRotSpeed = 0.08; 
        targetCamZ = 3.5;
        whiteRim.intensity = 10;
    }},
    
    // Stats Reveal
    { t: 3800, act: () => {
        t2.classList.remove('active'); t2.classList.add('exit');
        t3.classList.add('active');
        brainRotSpeed = 0.005;
        targetCamZ = 6; targetCamY = -0.5;
        whiteRim.intensity = 4;
    }},
    
    // Feature Reveal
    { t: 6500, act: () => {
        t3.classList.remove('active'); t3.classList.add('exit');
        t4.classList.add('active');
        targetCamZ = 4.5; targetCamY = 0.5;
        pinkFill.intensity = 8;
    }},
    
    // Brand
    { t: 9000, act: () => {
        t4.classList.remove('active'); t4.classList.add('exit');
        t5.classList.add('active');
        targetCamZ = 7; targetCamY = 0;
    }}
  ];

  timeline.forEach(event => {
    setTimeout(event.act, event.t);
  });
}
</script>
</body>
</html>
