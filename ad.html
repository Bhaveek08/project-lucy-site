<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucy Cinematic Ad</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* System UI font stack for premium look without external requests */
body {
  background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  overflow: hidden; width: 100vw; height: 100vh;
  position: relative; perspective: 1000px;
}

/* Background Particle Core */
#bg-canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.8; filter: blur(1px); }

/* Cinematic Scenes */
.scene {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px; text-align: center;
  opacity: 0; pointer-events: none;
}

/* Hook Scene: I PULLED THE PLUG */
.s-hook { z-index: 20; }
.hook-text {
  font-family: "SF Mono", "Cascadia Code", monospace;
  font-size: clamp(3rem, 10vw, 5rem); font-weight: 800;
  line-height: 1; text-transform: uppercase;
  opacity: 0; transform: scale(1.5) translateZ(100px);
  filter: blur(10px); color: #ff2d74;
}
.s-hook.step1 .hook-text {
  animation: slamText 0.15s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
}
@keyframes slamText {
  to { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0); }
}

.s-hook.step2 .hook-text {
  animation: glitchOut 0.2s forwards;
}
@keyframes glitchOut {
  0% { transform: translate(2px, -2px); opacity: 1; filter: invert(1); }
  50% { transform: translate(-2px, 2px); opacity: 1; }
  100% { transform: scale(0.9); opacity: 0; filter: blur(10px); }
}

.s-hook .hook-text-2 {
  font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800;
  line-height: 1; text-transform: uppercase; margin-top: 20px;
  opacity: 0; color: #fff;
}
.s-hook.step2 .hook-text-2 {
  animation: slamText 0.15s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
}
.s-hook.step3 .hook-text-2 {
  animation: fadeOut 0.5s ease forwards;
}

/* Scene 1: The Machine */
.s-machine h2 {
  font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700;
  line-height: 1.1; letter-spacing: -0.03em;
  background: linear-gradient(135deg, #fff, #9b8ea6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  transform: translateY(40px); opacity: 0;
}
.s-machine p {
  font-size: clamp(1rem, 4vw, 1.5rem); color: #9b8ea6;
  margin-top: 20px; max-width: 400px;
  transform: translateY(20px); opacity: 0;
}
.s-machine.active h2 { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.s-machine.active p { animation: fadeUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

/* Scene 2: 100% Local Grid */
.s-grid .stat-box {
  background: rgba(255, 45, 116, 0.1); border: 1px solid rgba(255, 45, 116, 0.3);
  padding: 30px; border-radius: 16px; margin: 10px;
  transform: scale(0.8) rotateX(20deg); opacity: 0;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.s-grid.active .stat-box {
  animation: pop3D 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes pop3D {
  to { transform: scale(1) rotateX(0deg); opacity: 1; }
}
.stat-box h3 {
  font-family: "SF Mono", monospace; font-size: 3.5rem; color: #ff2d74; line-height: 1;
}
.stat-box p { font-size: 1rem; color: #fff; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 10px; }

/* Scene 3: She works */
.s-work h2 {
  font-size: 3rem; font-weight: 800; color: #fff; text-shadow: 0 0 20px rgba(255,45,116,0.8);
  opacity: 0; transform: translateY(20px);
}
.s-work.active h2 { animation: fadeUp 0.5s ease forwards; }

/* Final Scene: CTA */
.s-cta .brand {
  font-family: "SF Mono", monospace; font-size: 3rem; font-weight: 800; letter-spacing: 0.3em;
  color: #fff; opacity: 0;
}
.s-cta .brand b { color: #ff2d74; }
.s-cta .url {
  font-size: 1.2rem; color: #9b8ea6; margin-top: 20px; opacity: 0;
}
.s-cta.active .brand { animation: fadeUp 0.8s ease forwards; }
.s-cta.active .url { animation: fadeUp 0.8s 0.2s ease forwards; }

/* Utils */
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeOut {
  to { opacity: 0; transform: scale(1.05); }
}

/* Flash Overlay */
#flash {
  position: fixed; inset: 0; background: #fff; z-index: 999;
  opacity: 0; pointer-events: none;
}
.do-flash { animation: flashAnim 0.2s ease-out; }
@keyframes flashAnim {
  0% { opacity: 1; } 100% { opacity: 0; }
}
</style>
</head>
<body>

<div id="flash"></div>
<canvas id="bg-canvas"></canvas>

<!-- HOOK -->
<div class="scene s-hook" id="s-hook">
  <div class="hook-text" id="h-txt1">I pulled the plug.</div>
  <div class="hook-text-2" id="h-txt2">She kept talking.</div>
</div>

<!-- SCENE 1 -->
<div class="scene s-machine" id="s-machine">
  <h2>Every part of her runs on one machine.</h2>
  <p>No cloud. No API calls. No subscription.</p>
</div>

<!-- SCENE 2 -->
<div class="scene s-grid" id="s-grid">
  <div class="stat-box">
    <h3>14k</h3>
    <p>Memories Local</p>
  </div>
  <div class="stat-box" style="animation-delay: 0.15s">
    <h3>0%</h3>
    <p>Cloud Dependency</p>
  </div>
</div>

<!-- SCENE 3 -->
<div class="scene s-work" id="s-work">
  <h2>She checks her own code.</h2>
</div>

<!-- SCENE 4 -->
<div class="scene s-cta" id="s-cta">
  <div class="brand"><b>L</b>UCY</div>
  <div class="url">project-lucy.me</div>
</div>

<script>
/* Particle Background Logic */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let w, h, particles = [];

function init() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  for(let i=0; i<80; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
      size: Math.random() * 2 + 1,
      color: Math.random() > 0.5 ? '#ff2d74' : '#9d4edd'
    });
  }
}
function draw() {
  ctx.fillStyle = 'rgba(5, 3, 8, 0.2)';
  ctx.fillRect(0, 0, w, h);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0 || p.x > w) p.vx *= -1;
    if(p.y < 0 || p.y > h) p.vy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
init(); draw();
window.addEventListener('resize', init);

/* Timeline Engine */
const flash = document.getElementById('flash');
const hook = document.getElementById('s-hook');
const m1 = document.getElementById('s-machine');
const m2 = document.getElementById('s-grid');
const m3 = document.getElementById('s-work');
const cta = document.getElementById('s-cta');

function triggerFlash() {
  flash.classList.remove('do-flash');
  void flash.offsetWidth; // trigger reflow
  flash.classList.add('do-flash');
}

// 0.0s - Start
setTimeout(() => {
  hook.style.opacity = '1';
  hook.classList.add('step1');
  triggerFlash();
}, 200);

// 1.5s - Second phrase
setTimeout(() => {
  hook.classList.add('step2');
  triggerFlash();
}, 1700);

// 3.0s - Exit hook, enter Scene 1
setTimeout(() => {
  hook.classList.add('step3');
}, 3000);

setTimeout(() => {
  hook.style.display = 'none';
  m1.classList.add('active');
}, 3500);

// 6.0s - Scene 2
setTimeout(() => {
  m1.style.opacity = '0';
  setTimeout(() => m2.classList.add('active'), 400);
}, 6000);

// 8.5s - Scene 3
setTimeout(() => {
  m2.style.opacity = '0';
  setTimeout(() => m3.classList.add('active'), 400);
  triggerFlash();
}, 8500);

// 10.5s - CTA
setTimeout(() => {
  m3.style.opacity = '0';
  setTimeout(() => cta.classList.add('active'), 400);
}, 10500);
</script>

</body>
</html>
