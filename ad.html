<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucy - Cinematic 3D Ad</title>
<style>
/* Reset & Base */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  overflow: hidden; width: 100vw; height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* 3D Canvas */
#webgl-container { position: absolute; inset: 0; z-index: 1; }

/* Film Grain Overlay */
.grain {
  position: absolute; inset: 0; z-index: 100;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  opacity: 0.05; pointer-events: none;
}

/* UI Overlay Layer */
.ui-layer {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  perspective: 1000px; padding: 20px; text-align: center; pointer-events: none;
}

/* Typography */
.text-element {
  position: absolute; width: 100%; opacity: 0; filter: blur(10px);
  transform: translateZ(-50px) scale(0.9);
}

.text-element.active {
  animation: txtIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.text-element.exit {
  animation: txtOut 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

h1 {
  font-size: clamp(3rem, 12vw, 6rem); font-weight: 800; line-height: 1;
  letter-spacing: -0.04em; margin-bottom: 8px;
}
p {
  font-size: clamp(1rem, 4vw, 1.5rem); color: rgba(255,255,255,0.7);
  letter-spacing: 0.05em; font-weight: 500;
}

.pink { color: #ff2d74; }

/* Brand Overlay */
.brand-footer {
  position: absolute; bottom: 40px; width: 100%; text-align: center;
  font-family: "SF Mono", ui-monospace, monospace; opacity: 0;
}
.brand-footer.active {
  animation: fadeUp 1s 0.5s ease forwards;
}
.brand-name { font-size: 2rem; font-weight: 800; letter-spacing: 0.4em; }
.brand-name b { color: #ff2d74; }

/* Keyframes */
@keyframes txtIn {
  0% { opacity: 0; filter: blur(10px); transform: translateZ(-50px) scale(0.9); }
  100% { opacity: 1; filter: blur(0); transform: translateZ(0) scale(1); }
}
@keyframes txtOut {
  0% { opacity: 1; filter: blur(0); transform: translateZ(0) scale(1); }
  100% { opacity: 0; filter: blur(10px); transform: translateZ(50px) scale(1.1); }
}
@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* Loading Screen */
#loader {
  position: absolute; inset: 0; background: #000; z-index: 999;
  display: flex; align-items: center; justify-content: center;
  font-family: "SF Mono", monospace; font-size: 0.8rem; color: #ff2d74;
  transition: opacity 0.5s;
}
</style>
</head>
<body>

<div id="loader">INITIALIZING NEURAL CORE...</div>
<div class="grain"></div>
<div id="webgl-container"></div>

<div class="ui-layer">
  
  <div class="text-element" id="t1">
    <h1>I pulled the plug.</h1>
  </div>
  
  <div class="text-element" id="t2">
    <h1 class="pink">She kept talking.</h1>
  </div>
  
  <div class="text-element" id="t3">
    <h1>100% Local.</h1>
    <p>14,000 memories on your machine.</p>
  </div>
  
  <div class="text-element" id="t4">
    <h1>She thinks.</h1>
    <p>And checks her own work.</p>
  </div>
  
  <div class="brand-footer" id="t5">
    <div class="brand-name"><b>L</b>UCY</div>
    <div style="font-size: 0.8rem; color: #9b8ea6; margin-top: 8px;">project-lucy.me</div>
  </div>

</div>

<!-- Three.js Libraries -->
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>

<script>
/* --- THREE.JS SCENE SETUP --- */
const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050308, 0.05);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Lighting - Dramatic Cinematic Lighting
const ambientLight = new THREE.AmbientLight(0x201530, 1.5);
scene.add(ambientLight);

const pinkRim = new THREE.DirectionalLight(0xff2d74, 5);
pinkRim.position.set(5, 5, -5);
scene.add(pinkRim);

const purpleFill = new THREE.DirectionalLight(0x9d4edd, 3);
purpleFill.position.set(-5, 0, 5);
scene.add(purpleFill);

const blueKick = new THREE.PointLight(0x4ea8de, 2, 20);
blueKick.position.set(0, -5, 0);
scene.add(blueKick);

// Load GLTF Model (The Brain)
let brainModel;
let materials = [];

const loader = new THREE.GLTFLoader();
loader.load('assets/brain.glb', (gltf) => {
  brainModel = gltf.scene;
  
  // Center and scale the model
  const box = new THREE.Box3().setFromObject(brainModel);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 3.5 / maxDim; // Fit to screen nicely
  brainModel.scale.set(scale, scale, scale);
  
  brainModel.position.sub(center.multiplyScalar(scale));
  brainModel.position.y -= 0.5; // Offset down slightly for text
  
  // Enhance materials to look like glowing glass/hologram
  brainModel.traverse((child) => {
    if (child.isMesh) {
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.9,
        roughness: 0.1,
        transmission: 0.9, // glass effect
        thickness: 0.5,
        emissive: 0xff2d74,
        emissiveIntensity: 0.1,
        wireframe: false
      });
      child.material = mat;
      materials.push(mat);
    }
  });

  scene.add(brainModel);
  
  // Remove Loader and Start Sequence
  document.getElementById('loader').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('loader').remove();
    startCinematicSequence();
  }, 500);
});

// Camera Animation Variables
let targetCamZ = 8;
let targetCamY = 0;
let brainRotSpeed = 0.005;

function animate() {
  requestAnimationFrame(animate);
  
  if (brainModel) {
    brainModel.rotation.y += brainRotSpeed;
    
    // Pulsing emissive effect
    const time = Date.now() * 0.001;
    const pulse = (Math.sin(time * 2) + 1) * 0.2;
    materials.forEach(m => m.emissiveIntensity = 0.1 + pulse);
  }
  
  // Smooth camera movement
  camera.position.z += (targetCamZ - camera.position.z) * 0.05;
  camera.position.y += (targetCamY - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* --- UI TIMELINE ENGINE --- */
function startCinematicSequence() {
  const t1 = document.getElementById('t1');
  const t2 = document.getElementById('t2');
  const t3 = document.getElementById('t3');
  const t4 = document.getElementById('t4');
  const t5 = document.getElementById('t5');
  
  const timeline = [
    // 0.5s: "I pulled the plug."
    { t: 500, act: () => { t1.classList.add('active'); targetCamZ = 6; } },
    
    // 2.5s: Exit T1, Enter T2 "She kept talking." (Dramatically spin brain)
    { t: 2500, act: () => { 
        t1.classList.remove('active'); t1.classList.add('exit');
        t2.classList.add('active'); 
        brainRotSpeed = 0.05; 
        targetCamZ = 4;
        pinkRim.intensity = 15;
    }},
    
    // 4.5s: Exit T2, Enter T3 "100% Local"
    { t: 4500, act: () => {
        t2.classList.remove('active'); t2.classList.add('exit');
        t3.classList.add('active');
        brainRotSpeed = 0.01;
        targetCamZ = 6.5; targetCamY = -1;
        pinkRim.intensity = 5;
    }},
    
    // 7.0s: Exit T3, Enter T4 "She thinks"
    { t: 7000, act: () => {
        t3.classList.remove('active'); t3.classList.add('exit');
        t4.classList.add('active');
        targetCamZ = 5; targetCamY = 1;
        purpleFill.intensity = 8;
    }},
    
    // 9.5s: Exit T4, Show Brand Logo
    { t: 9500, act: () => {
        t4.classList.remove('active'); t4.classList.add('exit');
        t5.classList.add('active');
        targetCamZ = 8; targetCamY = 0;
        brainRotSpeed = 0.002;
    }}
  ];

  timeline.forEach(event => {
    setTimeout(event.act, event.t);
  });
}
</script>
</body>
</html>
